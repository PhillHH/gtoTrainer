# Host-Nginx-vhost fuer den GTO Trainer.
#
# Einspielen (als root, siehe docs/RUNBOOK.md Abschnitt 8.4):
#   cp deploy/nginx/gto.growento.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/gto.growento.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Diese Datei ist der HTTP-Stand (Stufe A). `certbot --nginx -d gto.growento.com`
# ergaenzt anschliessend den TLS-Server-Block und den HTTP->HTTPS-Redirect
# automatisch (Stufe B).
#
# Zwei Pfade, zwei Ziele:
#   /api/*, /healthz  -> Backend-Container (127.0.0.1:3010)
#   alles andere      -> statische Frontend-Assets vom Dateisystem
# Es gibt bewusst KEINEN zusaetzlichen Reverse-Proxy- oder nginx-Container.

upstream gto_backend {
    # Muss zu BACKEND_HOST_PORT aus der .env passen.
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gto.growento.com;

    # Wurzel der gebauten Frontend-Assets; entspricht FRONTEND_STATIC_DIR.
    root /home/phillip/gto-static;
    index index.html;

    # Hand-History-Uploads kommen in spaeteren APs - Grenze grosszuegig genug.
    client_max_body_size 25m;

    access_log /var/log/nginx/gto.growento.com.access.log;
    error_log  /var/log/nginx/gto.growento.com.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # --- Gemeinsame Proxy-Einstellungen -------------------------------------
    # $scheme traegt hinter TLS "https"; ohne X-Forwarded-Proto koennte das
    # Backend das Secure-Cookie nicht korrekt einordnen (siehe ADR-0008).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- Backend-API --------------------------------------------------------
    location /api/ {
        proxy_pass http://gto_backend;
    }

    # --- Server-Sent Events (AP2.T2.5) --------------------------------------
    # Der Statuskanal der Job-Queue ist ein offen bleibender Strom. Mit
    # Standardeinstellungen wuerde Nginx ihn puffern und erst am Ende
    # ausliefern - im Ergebnis kaeme im Browser nichts an, bis der Server die
    # Verbindung schliesst. Deshalb hier ausdruecklich:
    #   proxy_buffering off  - jedes Ereignis sofort durchreichen
    #   proxy_cache off      - nichts zwischenspeichern
    #   HTTP/1.1 ohne Connection-Header - kein Verbindungsabbau nach Antwort
    #   grosszuegiger read timeout - eine stille Minute ist kein Fehler
    # Das Backend setzt zusaetzlich `X-Accel-Buffering: no`; diese Sektion
    # macht die Absicht in der Konfiguration sichtbar.
    location = /api/jobs/events {
        proxy_pass http://gto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # --- Liveness-Probe -----------------------------------------------------
    # Bewusst oeffentlich und ohne Session (siehe docs/INTERFACES.md).
    location = /healthz {
        proxy_pass http://gto_backend;
        access_log off;
    }

    # --- Statische Assets ---------------------------------------------------
    # Vite versieht Dateinamen mit Hash -> lange Cache-Zeit ist sicher.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA-Fallback -------------------------------------------------------
    # Unbekannte Pfade liefern index.html, damit das Client-Routing aus T1.4
    # (z. B. /drills beim Direktaufruf) funktioniert.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html nie cachen, sonst bleiben Nutzer auf altem JS haengen.
        add_header Cache-Control "no-cache";
    }
}
