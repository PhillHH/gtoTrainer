# Compose-Stack des GTO Trainers.
#
# Enthaelt Datenbank und Backend. Das Frontend wird NICHT containerisiert
# betrieben: Der Host-Nginx liefert die statischen Assets direkt aus
# (siehe ADR-0016) - so entsteht kein zweiter nginx bzw. Reverse Proxy.
#
# Alle nach aussen gemappten Host-Ports kommen aus Umgebungsvariablen und sind
# an 127.0.0.1 gebunden. Oeffentlich erreichbar ist ausschliesslich der
# Host-Nginx auf 80/443.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt - .env aus .env.example anlegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env aus .env.example anlegen}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt - .env aus .env.example anlegen}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT fehlt - .env aus .env.example anlegen}:5432'
    volumes:
      - gto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: gto-backend:latest
    container_name: gto-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Container-interner Port; nach aussen gemappt ueber BACKEND_HOST_PORT.
      PORT: '3000'
      HOST: 0.0.0.0
      # Im Compose-Netz wird der Service-Name aufgeloest - nicht der Host-Port.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /app/drizzle
      # Hinter TLS muss das Session-Cookie das Secure-Flag tragen (ADR-0008).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      TOTP_ENABLED: ${TOTP_ENABLED:-false}
      # --- LLM-Gateway (AP2.T2.2) ---------------------------------------
      # Der Container startet die Claude CLI NICHT selbst: Sie liegt samt
      # Profil B auf dem Host. Der Zugriff laeuft ueber den Host-Runner am
      # Unix-Domain-Socket (ADR-0022). Deshalb steht hier bewusst KEIN
      # CLAUDE_CONFIG_DIR - das Profil kennt allein der Runner.
      LLM_TRANSPORT: socket
      LLM_RUNNER_SOCKET_PATH: /run/gto-llm/gto-llm.sock
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-1000}
      LLM_RETRY_MAX_DELAY_MS: ${LLM_RETRY_MAX_DELAY_MS:-30000}
      LLM_RETRY_TOTAL_BUDGET_MS: ${LLM_RETRY_TOTAL_BUDGET_MS:-300000}
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:?BACKEND_HOST_PORT fehlt - .env aus .env.example anlegen}:3000'
    volumes:
      # Nur das Socket-Verzeichnis des Host-Runners, read-only. Das
      # Profil-B-Verzeichnis wird bewusst NICHT eingehaengt - der Container
      # sieht die Subscription-Zugangsdaten nie (ADR-0022).
      - ${LLM_RUNNER_SOCKET_DIR:?LLM_RUNNER_SOCKET_DIR fehlt - .env aus .env.example anlegen}:/run/gto-llm:ro
    depends_on:
      postgres:
        # Das Backend startet erst, wenn die Datenbank Anfragen annimmt.
        condition: service_healthy
    healthcheck:
      # busybox-wget ist in node:alpine enthalten; kein curl noetig.
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/healthz | grep -q ''"ok"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  gto-pgdata:
    name: gto-pgdata

# Der Host hat Dockers vordefinierte Adress-Pools (172.17-172.31/16 und
# 192.168.0.0/16 in /20-Bloecken) bereits vollstaendig durch fremde Projekte
# belegt - ein Netzwerk ohne feste Angabe scheitert mit
# "all predefined address pools have been fully subnetted".
# Deshalb bekommt dieses Projekt ein explizites, freies Subnetz. Die
# Daemon-Konfiguration bleibt unangetastet, damit fremde Projekte nicht
# beeinflusst werden.
networks:
  default:
    name: gto-net
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.89.0.0/24}
